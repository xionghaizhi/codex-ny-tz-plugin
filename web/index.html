<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>并发查看 · CPA</title>
  <script src="./concurrency.js" defer></script>
  <style>
    :root { color-scheme: light dark; --paper: #f4f7f6; --surface: #fff; --ink: #142623; --muted: #526760; --line: #d4dfda; --accent: #106653; --accent-ink: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #14201e; --surface: #1b2b27; --ink: #e4f1eb; --muted: #adcbc0; --line: #405b52; --accent: #92dfc3; --accent-ink: #112921; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 system-ui, sans-serif; }
    main { width: min(100% - 32px, 820px); margin: 44px auto; }
    h1, h2, p, dl, dd { margin: 0; }
    h1 { font-size: clamp(2rem, 7vw, 3rem); letter-spacing: -.04em; }
    h2 { font-size: 1.1rem; }
    header { border-top: 4px solid var(--accent); padding: 18px 0 24px; }
    header small, #sample-scope { font: 0.85rem ui-monospace, monospace; }
    header small { color: var(--accent); }
    .muted, dt { color: var(--muted); }
    form, section { background: var(--surface); border: 1px solid var(--line); padding: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 650; }
    .controls, nav:not([hidden]) { display: flex; flex-wrap: wrap; gap: 8px; }
    button, input { border: 1px solid var(--line); border-radius: 5px; padding: 9px 12px; min-height: 42px; font: inherit; }
    input { flex: 1; min-width: 0; }
    button { background: var(--surface); color: var(--ink); cursor: pointer; }
    button[type="submit"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    #status { margin: 8px 0 16px; min-height: 1.55em; }
    dl { display: grid; grid-template-columns: 1fr 1fr; border-top: 3px solid var(--accent); background: var(--surface); margin-bottom: 14px; }
    dl div { padding: 14px 18px; border: 1px solid var(--line); border-top: 0; }
    dl div + div { border-left: 0; }
    dd { font: 700 clamp(2.5rem, 10vw, 4.2rem)/1.13 ui-monospace, monospace; }
    #sample-scope { margin: 0 0 14px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 8px 5px; text-align: right; border-bottom: 1px solid var(--line); }
    th:first-child, td:first-child { text-align: left; overflow-wrap: anywhere; }
    th:not(:first-child) { white-space: nowrap; }
    nav { margin-top: 12px; }
    @media (max-width: 380px) { main { margin-top: 22px; } .controls > * { flex: 1 0 100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <small>CPA / ACCOUNT SNAPSHOT</small>
      <h1>并发查看</h1>
      <p class="muted">查看账号池正在执行的请求，以及正在等待空位的请求。</p>
    </header>
    <form id="concurrency-query" autocomplete="off">
      <label for="management-key">CPA 管理密钥</label>
      <div class="controls">
        <input id="management-key" type="password" required autocomplete="off" spellcheck="false" aria-describedby="key-note">
        <button id="refresh" type="submit">查询并发</button>
      </div>
      <p class="muted" id="key-note">只在当前页面使用，不保存密钥。</p>
    </form>
    <p id="status" class="muted" role="status">输入管理密钥后查询。</p>
    <dl aria-label="并发统计">
      <div><dt>当前在途</dt><dd id="active">—</dd></div>
      <div><dt>当前等待</dt><dd id="waiting">—</dd></div>
    </dl>
    <p id="sample-scope" class="muted">尚未读取数据</p>
    <section aria-labelledby="account-list" id="account-results" hidden>
      <h2 id="account-list">有在途或等待的账号</h2>
      <p id="empty" class="muted" hidden>这个范围内没有在途或等待的请求。</p>
      <table id="account-table" hidden>
        <thead><tr><th scope="col">账号</th><th scope="col">在途</th><th scope="col">等待</th><th scope="col">上限</th></tr></thead>
        <tbody id="busy-accounts"></tbody>
      </table>
      <nav aria-label="账号分页" id="pages" hidden>
        <button id="previous-page" type="button">上一页</button>
        <button id="next-page" type="button">下一页</button>
      </nav>
    </section>
  </main>
</body>
</html>
